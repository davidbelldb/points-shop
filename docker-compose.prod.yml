services:
  postgres:
    image: postgres:17-alpine
    container_name: points-shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  backend:
    build:
      context: ./backend
    container_name: points-shop-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_PORT: 3001
      BACKEND_HOST: 0.0.0.0
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MEDIA_DIR: /app/media
      TMDB_API_KEY: ${TMDB_API_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@sneakypoints.com}
      # Native iOS push (APNs) — token-based auth via .p8 key (base64-encoded)
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-com.david.sneakystuff}
      APNS_AUTH_KEY_BASE64: ${APNS_AUTH_KEY_BASE64:-}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-true}
      LASTFM_API_KEY: ${LASTFM_API_KEY}
      FATSECRET_CLIENT_ID: ${FATSECRET_CLIENT_ID:-}
      FATSECRET_CLIENT_SECRET: ${FATSECRET_CLIENT_SECRET:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      # Azure Speech (Just Say The Word pronunciation scoring)
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      TURN_REALM: ${TURN_REALM:-sneakypoints.com}
    volumes:
      - media:/app/media
    networks:
      - app

  coturn:
    image: coturn/coturn:4.6.2-alpine
    container_name: points-shop-coturn
    restart: unless-stopped
    # Host networking — coturn needs to bind its relay port range directly
    # on the VPS's public IP, which is awkward to express through Docker's
    # bridge/NAT port mapping for a whole port range.
    network_mode: host
    volumes:
      - ./turn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --realm=${TURN_REALM:-sneakypoints.com}

  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
      args:
        VITE_GIPHY_API_KEY: ${VITE_GIPHY_API_KEY}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
    container_name: points-shop-caddy
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - app

volumes:
  postgres-data:
  media:
  caddy-data:
  caddy-config:

networks:
  app:
    driver: bridge
