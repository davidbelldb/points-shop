# coturn TURN/STUN server config for Sneaky Points video calls
# (Tic-Tac-Face and Sneaky Calls). Provides a relay fallback for when
# peer-to-peer ICE fails (symmetric NAT, CGNAT, restrictive mobile/WiFi
# networks) — STUN alone often isn't enough for that case.
#
# static-auth-secret, external-ip and realm are injected at runtime via
# command-line flags in docker-compose.prod.yml (from .env), so they are
# NOT hardcoded here / committed to git.

listening-port=3478

# Relay (TURN) ports — keep this range small and open exactly this range
# as UDP in the Hetzner firewall. 100 ports is comfortably enough for two
# people making occasional calls.
min-port=49152
max-port=49252

# Long-term credential mechanism using a shared secret (time-limited
# credentials minted per-call by the backend at /api/rtc/turn-credentials).
lt-cred-mech
use-auth-secret

fingerprint
no-cli
no-multicast-peers

# Don't allow the relay to be used to reach private/internal address
# ranges (defense in depth — this box also runs postgres etc on the
# docker bridge network).
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
