<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1f1f1e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f0fdf8" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Opaque status bar: iOS reserves the top safe area and places the whole
         web app below it, so content is anchored to the bottom edge and never
         renders under the clock/signal. (black-translucent = full-bleed, which
         pulled the UI up under the status bar.) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Sneaky Stuff" />
    <title>Sneaky Stuff</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
