<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover = full-bleed (content reaches the bottom edge, no
         home-indicator gap). The TOP status-bar area is reserved in CSS via
         padding-top: env(safe-area-inset-top) on the header. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1f1f1e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f0fdf8" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Translucent = app fills the whole screen edge-to-edge (no bottom strip);
         the only reserved area is the top, handled in CSS by the header's
         padding-top: env(safe-area-inset-top) for the Dynamic Island / clock. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sneaky Stuff" />
    <title>Sneaky Stuff</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
